server {
  listen 80;
  server_name localhost;
  root /fleetbase/api/public;
  # hide nginx version for security purposes
  server_tokens off;
  access_log  /var/log/nginx/access.log;
  error_log  /var/log/nginx/error_log;
  proxy_connect_timeout       600;
  proxy_send_timeout          600;
  proxy_read_timeout          600;
  send_timeout                600;
  index index.php;

  # tweaks
  client_max_body_size 600M;
  client_body_buffer_size 1m;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 16k;
  keepalive_timeout 2 2;

  #gzip tweaks
  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1100;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types text/plain application/javascript application/json application/x-javascript text/xml text/css;

  #open file cache tweaks
  open_file_cache max=2000 inactive=20s;
  open_file_cache_valid 60s;
  open_file_cache_min_uses 5;
  open_file_cache_errors off;

  # CORS - allow all origins
  set $cors_origin "";
  if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1)(:\d+)?$") {
    set $cors_origin $http_origin;
  }
  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, X-CSRF-Token" always;
  add_header Access-Control-Allow-Credentials "true" always;
  add_header Access-Control-Max-Age "86400" always;

  if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin $cors_origin;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, X-CSRF-Token";
    add_header Access-Control-Allow-Credentials "true";
    add_header Access-Control-Max-Age "86400";
    add_header Content-Length 0;
    add_header Content-Type text/plain;
    return 204;
  }

  location / {
    proxy_set_header Host            $host;
    proxy_pass   http://${NGINX_APPLICATION_HOSTNAME}:8000;
  }
}
