services:
  cache:
    image: redis:4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: mysql:8.0-oracle
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - "./docker/database/:/docker-entrypoint-initdb.d/"
      - "./docker/database/mysql:/var/lib/mysql"
      - "./docker/database/socket.cnf:/etc/mysql/conf.d/socket.cnf:ro"
    command: ["bash", "-c", "rm -f /var/lib/mysql/mysql.sock /var/lib/mysql/mysql.sock.lock /var/lib/mysql/mysqlx.sock /var/lib/mysql/mysqlx.sock.lock && exec /entrypoint.sh mysqld"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "fleetbase"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  socket:
    image: socketcluster/socketcluster:v17.4.0
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "38000:8000"
    environment:
      SOCKETCLUSTER_WORKERS: 10
      SOCKETCLUSTER_BROKERS: 10
      # SOCKETCLUSTER_OPTIONS can be set via docker-compose.override.yml for specific environments
      # For production, use: SOCKETCLUSTER_OPTIONS: '{"origins":"https://yourdomain.com:*"}'
      # For development, use: SOCKETCLUSTER_OPTIONS: '{"origins":"http://localhost:*"}'

  scheduler:
    image: fleetbase/fleetbase-api:latest
    command: ["go-crond", "--verbose", "root:./crontab"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
    depends_on:
      - database
      - cache

  queue:
    image: fleetbase/fleetbase-api:latest
    command: ["php", "artisan", "queue:work"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:status"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
    depends_on:
      - database
      - cache

  console:
    restart: unless-stopped
    build:
      context: ./console
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: development
    ports:
      - "4200:4200"
    volumes:
      - ./console/fleetbase.config.json:/usr/share/nginx/html/fleetbase.config.json

  application:
    restart: unless-stopped
    image: fleetbase/fleetbase-api:latest
    volumes:
      - ./api/.env:/fleetbase/api/.env
      - ./api/storage/app:/fleetbase/api/storage/app
    command: >
      sh -c "
        chown -R www-data:www-data /fleetbase/api/storage/app &&
        chmod -R 775 /fleetbase/api/storage/app &&
        php /fleetbase/api/artisan storage:link --force &&
        sed -i \"s|https://flb-assets.s3.ap-southeast-1.amazonaws.com/static/fleetbase-logo.png|/images/elite_green.jpeg|g\" /fleetbase/api/vendor/fleetbase/core-api/config/fleetbase.php &&
        sed -i \"s|https://flb-assets.s3.ap-southeast-1.amazonaws.com/static/fleetbase-icon.png|/images/icon.png|g\" /fleetbase/api/vendor/fleetbase/core-api/config/fleetbase.php &&
        exec php artisan octane:frankenphp --max-requests=1000 --port=8000 --host=0.0.0.0
      "
    environment:
      ENVIRONMENT: development
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
      SESSION_DOMAIN: localhost
      BROADCAST_DRIVER: socketcluster
      MAIL_FROM_NAME: Elite Logistics
      APP_NAME: Elite Logistics
      LOG_CHANNEL: daily
      FILESYSTEM_DRIVER: public
      REGISTRY_HOST: https://registry.fleetbase.io
      REGISTRY_PREINSTALLED_EXTENSIONS: "true"
      OSRM_HOST: https://router.project-osrm.org
    depends_on:
      - database
      - cache
      - queue

  httpd:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/httpd/Dockerfile
    ports:
      - "8000:80"
    volumes:
      # nginx serves /storage/ directly via alias; it needs the same uploads
      # directory the application container writes to, or every upload 404s.
      - ./api/storage/app/public:/fleetbase/api/storage/app/public:ro
    depends_on:
      - application
