<!DOCTYPE html>
<!-- dir is required: postcss-rtlcss scopes every direction-sensitive rule under [dir="ltr"] /
     [dir="rtl"], so an unset dir leaves those declarations unmatched. services/language.js
     rewrites lang/dir when the locale changes. -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="msapplication-TileColor" content="#5dd62c" />
    <meta name="theme-color" content="#5dd62c" />
    <title>Elite Logistics</title>

    {{content-for "head"}}

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon/android-chrome-256x256.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="mask-icon" href="/favicon/safari-pinned-tab.svg" color="#5dd62c" />
    <link integrity="" rel="stylesheet" href="{{rootURL}}assets/vendor.css">
    <link integrity="" rel="stylesheet" href="{{rootURL}}assets/@fleetbase/console.css">

    {{content-for "head-footer"}}
  </head>
  <body>
    {{content-for "body"}}
    <div id="boot-loader" class="overloader">
      <div class="loader-container">
        <span class="fleetbase-loader" width="16" height="16"></span>
        <div class="loading-message">Starting up...</div>
      </div>
    </div>
    <script src="{{rootURL}}assets/vendor.js"></script>
    <script src="{{rootURL}}assets/@fleetbase/console.js"></script>

    {{content-for "body-footer"}}
  </body>
</html>
